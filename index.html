<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mój Trening</title>
<meta name="theme-color" content="#6c5ce7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trening">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1f1d2b;--mut:#6b6880;--acc:#6c5ce7;--acc2:#efecff;--ok:#1fa971;--bad:#d64545;--line:#e6e3f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:520px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:18px;margin:18px 0 8px}h3{margin:0;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,30,90,.08)}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--acc2);color:var(--acc)}button.bad{background:#fdeaea;color:var(--bad)}button.sm{padding:7px 11px;font-size:14px}
button.full{width:100%}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:21px}.nav button.on{color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;background:#fff;color:var(--mut);border:1.5px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ex{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:8px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,90,.08)}
.ex .th{width:84px;height:56px;flex:none;background:var(--acc2);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ex .th img{width:100%;height:100%;object-fit:cover}.ex .tx{flex:1;min-width:0}
.fig{width:100%;height:100%;display:block}
.big{background:var(--acc2);border-radius:16px;overflow:hidden;aspect-ratio:3/2}
.big img{width:100%;height:100%;object-fit:contain}
.ov{position:fixed;inset:0;background:rgba(20,15,50,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
ol{padding-left:20px;margin:8px 0}ol li{margin-bottom:6px}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:6px}
.sethead{font-size:12px;color:var(--mut);text-align:center}.set .n{text-align:center;font-weight:700;color:var(--mut)}
.set input{text-align:center;padding:9px 4px}
.chk{background:#ecebf3;color:#9d9bb0;padding:9px 0}.set.done .chk{background:var(--ok);color:#fff}.set.done input{background:#e8f8f0}
.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:15;padding:0 14px}
.rest div{max-width:492px;width:100%;background:#1f1d2b;color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.rest b{font-size:22px}.rest button{background:#3b3857;padding:7px 12px}
.warn{background:#fff4d6;color:#7a5a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
.lbl{font-size:13px;color:var(--mut);margin:10px 0 4px;display:block}
.num{width:64px;text-align:center;padding:8px 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"></div>
<div class="nav"><div id="nav"></div></div>
<div id="modal"></div>
<script>
/* ===== Ćwiczenia: silnik rysunków + biblioteka =====
   Rysunki są nasze własne (generowane kodem), opisy napisane po polsku od zera. */
const GROUPS=['Nogi','Pośladki','Plecy','Klatka','Barki','Biceps','Triceps','Brzuch'];
const C={body:'#4b4676',far:'#a9a4cf',hl:'#ff7a59',skin:'#f2c7a5',metal:'#a3a8bd',plate:'#2f2c4a',pad:'#d8d3f2',frame:'#b9bdd2',floor:'#d6d2ec',cable:'#8a8ca3'};
const WD={torso:21,thigh:14,shin:11,uarm:10,farm:9};
const r1=x=>Math.round(x*10)/10;
const ln=(p,q,w,c)=>`<line x1="${r1(p[0])}" y1="${r1(p[1])}" x2="${r1(q[0])}" y2="${r1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const ci=(p,r,c)=>`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r}" fill="${c}"/>`;
const padR=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${C.pad}"/>`;
const fr=(x1,y1,x2,y2,w)=>ln([x1,y1],[x2,y2],w||5,C.frame);
const plate=(p,r)=>ci(p,r,C.plate)+ci(p,r*0.36,C.metal);
const lerp=(a,b,t)=>a+(b-a)*t;
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];

const D={
 bench:padR(35,104,115,9)+fr(48,113,48,143)+fr(138,113,138,143),
 box:padR(38,102,50,41),
 pbar:fr(70,14,170,14,5)+fr(70,14,70,143,3)+fr(170,14,170,143,3),
 seat:padR(98,100,46,8)+fr(121,108,121,143),
 seatBack:padR(98,40,9,62)+padR(98,100,46,8)+fr(121,108,121,143),
 smith:fr(92,8,92,143,3)+fr(152,8,152,143,3),
 hack:ln([58,34],[98,124],14,C.pad)+fr(40,143,130,143,4),
 incline:ln([52,70],[97,115],12,C.pad)+padR(92,116,42,7)+fr(102,123,102,143),
 sideBench:padR(158,108,56,8)+fr(168,116,168,143)+fr(204,116,204,143),
 mach:ln([36,88],[88,129],12,C.pad)+fr(30,141,205,141,4),
 preacher:ln([132,52],[152,104],11,C.pad)+fr(152,104,152,143,4),
 legext:padR(56,40,9,62)+padR(58,100,52,8)+fr(84,108,84,143),
 prone:padR(30,108,160,8)+fr(44,116,44,143)+fr(176,116,176,143),
 chestM:padR(82,40,10,62)+padR(86,102,46,8)+fr(109,110,109,143)+fr(92,60,92,60,2),
 pulldown:padR(92,106,50,8)+fr(117,114,117,143)+padR(130,92,30,6),
 seatedRow:padR(70,108,48,8)+fr(94,116,94,143)+fr(168,86,168,143,5),
 abduct:padR(98,102,44,8)+fr(120,110,120,143)
};

/* ---- rysowanie: widok z boku ---- */
function figSide(ex,t){
 const j={};for(const k in ex.a){const A=ex.a[k],B=ex.b[k]||A;j[k]=[lerp(A[0],B[0],t),lerp(A[1],B[1],t)]}
 const hl=new Set(ex.hl||[]);const col=(k,d)=>hl.has(k)?C.hl:d;
 const face=ex.face||1,far=p=>[p[0]-5,p[1]-1.5];
 let s=`<svg viewBox="0 0 240 160" class="fig" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="144" x2="232" y2="144" stroke="${C.floor}" stroke-width="3" stroke-linecap="round"/>${ex.deco||''}`;
 // dalsze kończyny
 s+=ln(far(j.s),far(j.e),WD.uarm-1,C.far)+ln(far(j.e),far(j.w),WD.farm-1,C.far);
 if(j.k2)s+=ln(j.p,j.k2,WD.thigh-1,C.far)+ln(j.k2,j.a2,WD.shin-1,C.far);
 else s+=ln(far(j.p),far(j.k),WD.thigh-1,C.far)+ln(far(j.k),far(j.a),WD.shin-1,C.far);
 // tułów
 const m=mid(j.s,j.p);
 s+=ln(j.s,m,WD.torso,col('torsoU',C.body))+ln(m,j.p,WD.torso,col('torsoL',C.body));
 // bliższa noga
 s+=ln(j.p,j.k,WD.thigh,col('thigh',C.body))+ln(j.k,j.a,WD.shin,col('shin',C.body));
 if(hl.has('glute'))s+=ci(j.p,9.5,C.hl);
 // ramię
 s+=ln(j.s,j.e,WD.uarm,col('uarm',C.body))+ln(j.e,j.w,WD.farm,col('farm',C.body));
 if(hl.has('shoulder'))s+=ci(j.s,8.5,C.hl);
 // szyja i głowa
 s+=ln(j.s,j.h,7,C.skin)+ci(j.h,9.5,C.skin);
 // dłonie i stopy
 s+=ci(j.w,4.6,C.skin);
 if(!ex.nofoot){
  if(j.a[1]>=136)s+=ln(j.a,[j.a[0]+face*11,j.a[1]],6,C.body);
  if(j.a2&&j.a2[1]>=136)s+=ln(j.a2,[j.a2[0]+face*11,j.a2[1]],5,C.far);
 }
 // sprzęt
 const pt=ex.barAt==='s'?j.s:ex.barAt==='p'?j.p:j.w;
 if(ex.cable){s+=ln(ex.cable,j.w,2,C.cable)+ci(ex.cable,5,C.metal)+ci(j.w,3,C.metal)}
 if(ex.plate){const dx=j.a[0]-j.k[0],dy=j.a[1]-j.k[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;s+=ln([j.a[0]+nx*16+dx/L*4,j.a[1]+ny*16+dy/L*4],[j.a[0]-nx*16+dx/L*4,j.a[1]-ny*16+dy/L*4],6,C.metal)}
 if(ex.draw==='bar')s+=ln([pt[0]-15,pt[1]],[pt[0]+15,pt[1]],3,C.metal)+plate(pt,10);
 else if(ex.draw==='db')s+=plate(pt,6.5);
 else if(ex.draw==='kb')s+=`<path d="M${r1(pt[0]-5)} ${r1(pt[1]-5)} q5 -9 10 0" fill="none" stroke="${C.plate}" stroke-width="3"/>`+ci([pt[0],pt[1]+1],7,C.plate);
 return s+'</svg>';
}
/* ---- rysowanie: widok z przodu (lewa strona definiowana, prawa odbijana) ---- */
function figFront(ex,t){
 const j={};for(const k in ex.a){const A=ex.a[k],B=ex.b[k]||A;j[k]=[lerp(A[0],B[0],t),lerp(A[1],B[1],t)]}
 const R=p=>[240-p[0],p[1]];const hl=new Set(ex.hl||[]);const col=(k,d)=>hl.has(k)?C.hl:d;
 let s=`<svg viewBox="0 0 240 160" class="fig" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="144" x2="232" y2="144" stroke="${C.floor}" stroke-width="3" stroke-linecap="round"/>${ex.deco||''}`;
 const sR=R(j.s),pR=R(j.p),eR=R(j.e),wR=R(j.w),kR=R(j.k),aR=R(j.a);
 s+=ln(j.p,j.k,WD.thigh,col('thigh',C.body))+ln(j.k,j.a,WD.shin,C.body)+ln(pR,kR,WD.thigh,col('thigh',C.body))+ln(kR,aR,WD.shin,C.body);
 s+=ln([120,j.s[1]+4],[120,j.p[1]-2],27,col('torsoU',C.body))+ln(j.p,pR,17,C.body)+ln(j.s,sR,15,col('torsoU',C.body));
 s+=ln(j.s,j.e,WD.uarm,col('uarm',C.body))+ln(j.e,j.w,WD.farm,C.body)+ln(sR,eR,WD.uarm,col('uarm',C.body))+ln(eR,wR,WD.farm,C.body);
 if(hl.has('shoulder'))s+=ci(j.s,8.5,C.hl)+ci(sR,8.5,C.hl);
 if(hl.has('trap'))s+=ln([108,j.s[1]-3],[132,j.s[1]-3],12,C.hl);
 s+=ln([120,j.s[1]],[120,j.h[1]],7,C.skin)+ci(j.h,9.5,C.skin);
 s+=ci(j.w,4.6,C.skin)+ci(wR,4.6,C.skin);
 s+=ln(j.a,[j.a[0]-9,j.a[1]],6,C.body)+ln(aR,[aR[0]+9,aR[1]],6,C.body);
 if(ex.draw==='db'||ex.draw==='bar')s+=plate(j.w,6.5)+plate(wR,6.5);
 return s+'</svg>';
}
const figSVG=(ex,t)=>ex.view==='front'?figFront(ex,t):figSide(ex,t);

/* ===== Szablony ruchów: pozy start (a) i koniec (b) ===== */
const STAND={h:[120,28],s:[120,46],p:[120,88],k:[120,116],a:[120,142]};
const BENT={h:[168,64],s:[154,72],p:[108,84],k:[128,112],a:[120,142]};
const LYING={h:[62,96],s:[78,98],p:[132,98],k:[160,114],a:[158,142]};
const SEATED={h:[116,40],s:[116,58],p:[112,104],k:[150,102],a:[152,140]};
const T={};
const tp=(id,o)=>{T[id]=o};
tp('squat',{g:'Nogi',hl:['thigh','glute'],mus:'czworogłowe ud, pośladki',
 a:{...STAND,e:[132,58],w:[142,50]},b:{h:[138,46],s:[130,60],p:[100,102],k:[145,108],a:[122,142],e:[148,70],w:[158,62]},
 steps:['Stań na szerokość bioder lub odrobinę szerzej, palce stóp lekko na zewnątrz.','Napnij brzuch, odepchnij biodra do tyłu i zacznij uginać kolana.','Zejdź w dół, aż uda będą mniej więcej równolegle do podłogi.','Wypchnij się piętami w górę do pozycji wyjściowej.'],
 tips:'Kolana idą w kierunku palców stóp, plecy proste, pięty cały czas na podłodze.'});
tp('lunge',{g:'Nogi',hl:['thigh','glute'],mus:'czworogłowe ud, pośladki',
 a:{...STAND,k2:[120,116],a2:[120,142],e:[128,70],w:[122,90]},
 b:{h:[122,38],s:[122,56],p:[122,98],k:[152,102],a:[152,142],k2:[100,128],a2:[86,142],e:[130,74],w:[122,94]},
 steps:['Stań prosto, ręce na biodrach lub z hantlami przy ciele.','Zrób duży krok do przodu.','Opuść biodra w dół, aż przednie kolano ma ok. 90°, a tylne prawie dotyka podłogi.','Odepchnij się przednią stopą i wróć do pozycji wyjściowej. Zrób serię na jedną nogę, potem na drugą.'],
 tips:'Tułów prosto, przednie kolano nie wychodzi mocno przed palce stopy.'});
tp('deadlift',{g:'Plecy',hl:['torsoL','glute','thigh'],mus:'prostowniki grzbietu, pośladki, tył uda',draw:'bar',
 a:{h:[166,66],s:[152,74],p:[106,86],k:[128,114],a:[118,142],e:[152,98],w:[150,120]},
 b:{h:[122,28],s:[120,46],p:[116,90],k:[120,116],a:[118,142],e:[120,72],w:[122,96]},
 steps:['Stań na szerokość bioder, ciężar tuż przy goleniach.','Zegnij się w biodrach (pupa do tyłu), plecy proste, chwyć ciężar.','Napnij brzuch i wypchnij biodra do przodu, prostując jednocześnie nogi i plecy.','Na górze ściśnij pośladki, potem kontrolowanie opuść ciężar po nogach.'],
 tips:'Plecy nigdy nie są zaokrąglone, a ciężar jedzie blisko ciała. Zaczynaj od lekkiego obciążenia.'});
tp('rdl',{g:'Pośladki',hl:['glute','thigh','torsoL'],mus:'tył uda, pośladki, prostowniki grzbietu',draw:'bar',
 a:{h:[122,28],s:[120,46],p:[116,90],k:[120,116],a:[118,142],e:[120,72],w:[122,96]},
 b:{h:[168,70],s:[154,78],p:[108,88],k:[114,116],a:[116,142],e:[156,100],w:[156,122]},
 steps:['Stań prosto z ciężarem trzymanym przed udami, kolana lekko ugięte.','Odpychaj biodra do tyłu, ciężar sunie po udach i łydkach.','Zejdź do momentu mocnego rozciągnięcia z tyłu ud (zwykle do połowy łydek).','Wypchnij biodra do przodu i wróć do pozycji stojącej.'],
 tips:'Ruch wychodzi z bioder, nie z pleców. Kolana prawie nie zmieniają kąta.'});
tp('hipthrust',{g:'Pośladki',hl:['glute'],mus:'pośladki',deco:D.box,
 a:{h:[48,92],s:[66,96],p:[122,126],k:[156,104],a:[160,142],e:[90,108],w:[116,118]},
 b:{h:[48,92],s:[66,96],p:[122,98],k:[160,100],a:[162,142],e:[90,108],w:[116,118]},
 steps:['Usiądź na podłodze, łopatkami oprzyj się o ławkę lub krawędź kanapy.','Stopy na podłodze, kolana ugięte. Opcjonalnie połóż ciężar na biodrach.','Wypchnij biodra w górę, aż tułów i uda będą w jednej linii.','Ściśnij mocno pośladki na górze i opuść biodra kontrolowanie.'],
 tips:'Broda lekko przyciągnięta do klatki, żebra „zamknięte”, nie wyginaj lędźwi.'});
tp('bridge',{g:'Pośladki',hl:['glute'],mus:'pośladki, tył uda',nofoot:false,
 a:{h:[44,128],s:[62,132],p:[112,132],k:[146,106],a:[146,142],e:[84,134],w:[104,136]},
 b:{h:[44,128],s:[62,132],p:[112,102],k:[146,106],a:[146,142],e:[84,134],w:[104,136]},
 steps:['Połóż się na plecach, kolana ugięte, stopy blisko pośladków.','Wciśnij pięty w podłogę i unieś biodra do linii ramiona–biodra–kolana.','Zatrzymaj na sekundę, ściskając pośladki.','Opuść biodra powoli.'],
 tips:'Dobre na rozgrzewkę i na początek. Możesz dołożyć ciężar na biodra.'});
tp('calf',{g:'Nogi',hl:['shin'],mus:'łydki',
 a:{...STAND,e:[122,68],w:[122,90]},b:{h:[120,18],s:[120,36],p:[120,78],k:[120,106],a:[120,134],e:[122,58],w:[122,80]},nofoot:true,
 steps:['Stań prosto, stopy na szerokość bioder.','Wspnij się wysoko na palce.','Zatrzymaj się na górze na sekundę.','Opuść pięty powoli do podłogi.'],
 tips:'Możesz stanąć na schodku, żeby mieć większy zakres ruchu.'});
tp('bench',{g:'Klatka',hl:['torsoU'],mus:'mięsień piersiowy, triceps, przód barku',draw:'bar',deco:D.bench,
 a:{...LYING,e:[80,78],w:[80,56]},b:{...LYING,e:[96,90],w:[80,86]},
 steps:['Połóż się na ławce, stopy mocno na podłodze, łopatki ściągnięte.','Chwyć ciężar nieco szerzej niż barki.','Opuść ciężar kontrolowanie do środka klatki piersiowej.','Wypchnij w górę, aż ręce będą prawie proste.'],
 tips:'Łokcie ok. 45° od tułowia, nie 90°. Przy większych ciężarach ćwicz z asekuracją.'});
tp('incline',{g:'Klatka',hl:['torsoU','shoulder'],mus:'górna część klatki, barki, triceps',draw:'bar',deco:D.incline,
 a:{h:[58,60],s:[72,76],p:[104,108],k:[136,114],a:[140,142],e:[88,60],w:[103,45]},
 b:{h:[58,60],s:[72,76],p:[104,108],k:[136,114],a:[140,142],e:[94,90],w:[82,74]},
 steps:['Ustaw ławkę pod kątem ok. 30–45°. Połóż się, łopatki ściągnięte, stopy na podłodze.','Chwyć ciężar nieco szerzej niż barki.','Opuść ciężar do górnej części klatki piersiowej.','Wypchnij w górę, nie odrywając pleców od oparcia.'],
 tips:'Zbyt stromy kąt przerzuca pracę na barki. Zostań przy łagodnym skosie.'});
tp('fly',{g:'Klatka',hl:['torsoU'],mus:'mięsień piersiowy',draw:'db',deco:D.bench,
 a:{...LYING,e:[80,77],w:[80,56]},b:{...LYING,e:[66,94],w:[54,101]},

/* ===== Stan i zapis ===== */
const KEY='trening_v1';
let S={plans:[],logs:[],custom:[],active:null,rest:90};
let storageOK=true;
try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);S=Object.assign(S,d)}}catch(e){storageOK=false}
S.custom.forEach(e=>{if(e.group==='Ramiona')e.group='Biceps'});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const allEx=()=>BUILTIN.concat(S.custom);
const getEx=id=>allEx().find(e=>e.id===id);
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};

function thumb(ex){return ex.img?`<img src="${ex.img}" alt="">`:ex.a?figSVG(ex,0.5).replace('viewBox="0 0 240 160"','viewBox="24 4 192 148"'):'<span style="font-size:26px">🏋️</span>'}

/* ===== Nawigacja i widoki ===== */
let tab='home',view=null,edit=null,LIB={q:'',g:''},PK={q:'',g:''},pickCb=null,animT=null;
function go(t){tab=t;view=null;render()}
function render(){
 const nav=[['home','🏋️','Trening'],['lib','📖','Ćwiczenia'],['hist','📈','Historia'],['set','⚙️','Ustawienia']];
 document.getElementById('nav').innerHTML=nav.map(n=>`<button class="${tab===n[0]&&!view?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
 let h='';
 const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
 if(isIOS&&!standalone&&!S.hideInstall)h+='<div class="warn"><b>Zainstaluj aplikację:</b> w Safari kliknij Udostępnij (kwadrat ze strzałką) → „Dodaj do ekranu początkowego”. Dopiero z ikony na ekranie wpisuj treningi, bo dane z Safari i z ikony nie są wspólne. <button class="sm sec" style="margin-top:8px" onclick="S.hideInstall=1;save();render()">Rozumiem</button></div>';
 if(!storageOK)h+='<div class="warn">Uwaga: ta przeglądarka nie zapisuje danych na stałe. Zrób kopię zapasową w Ustawieniach.</div>';
 if(view==='edit')h+=vEdit();else if(view==='active')h+=vActive();
 else if(tab==='home')h+=vHome();else if(tab==='lib')h+=vLib();else if(tab==='hist')h+=vHist();else h+=vSet();
 document.getElementById('app').innerHTML=h;
 renderRest();
}

/* --- Home --- */
function vHome(){
 let h='<h1>Cześć! 💪</h1>';
 if(S.active)h+=`<div class="card" style="background:var(--acc);color:#fff"><b>Trening w toku:</b> ${esc(S.active.name)}<div class="row" style="margin-top:10px"><button class="full" style="background:#fff;color:var(--acc)" onclick="view='active';render()">Kontynuuj</button></div></div>`;
 h+='<div class="row sp"><h2 style="margin:6px 0">Moje treningi</h2><button class="sm" onclick="newPlan()">+ Nowy</button></div>';
 if(!S.plans.length)h+='<div class="card mut">Nie masz jeszcze żadnego treningu. Kliknij „+ Nowy”, wybierz ćwiczenia z listy i ułóż swój plan.</div>';
 S.plans.forEach(p=>{
  h+=`<div class="card"><h3>${esc(p.name)}</h3><div class="mut" style="margin:4px 0 10px">${p.items.map(i=>esc((getEx(i.ex)||{name:'?'}).name)+' '+i.sets+'×'+esc(i.reps)).join(' · ')}</div>
  <div class="row"><button style="flex:1" onclick="startPlan('${p.id}')">Start</button><button class="sec" onclick="editPlan('${p.id}')">Edytuj</button></div></div>`;
 });
 h+='<button class="sec full" onclick="startPlan(null)">Pusty trening (dodam ćwiczenia w trakcie)</button>';
 return h;
}
function newPlan(){edit={id:null,name:'',items:[]};view='edit';render()}
function editPlan(id){const p=S.plans.find(x=>x.id===id);edit=JSON.parse(JSON.stringify(p));view='edit';render()}

/* --- Edytor planu --- */
function vEdit(){
 let h=`<div class="row sp"><button class="sec sm" onclick="view=null;render()">← Wróć</button><h2 style="margin:0">${edit.id?'Edytuj trening':'Nowy trening'}</h2><span></span></div>
 <label class="lbl">Nazwa treningu</label><input value="${esc(edit.name)}" placeholder="np. Nogi i pośladki" oninput="edit.name=this.value">
 <h2>Ćwiczenia</h2>`;
 if(!edit.items.length)h+='<div class="card mut">Dodaj pierwsze ćwiczenie 👇</div>';
 edit.items.forEach((it,i)=>{const ex=getEx(it.ex)||{name:'(usunięte)',a:null};
  h+=`<div class="card"><div class="row sp"><h3>${esc(ex.name)}</h3><div class="row"><button class="sec sm" onclick="mv(${i},-1)">↑</button><button class="sec sm" onclick="mv(${i},1)">↓</button><button class="bad sm" onclick="edit.items.splice(${i},1);render()">✕</button></div></div>
  <div class="row" style="margin-top:10px"><span class="mut">Serie</span><input class="num" inputmode="numeric" value="${it.sets}" oninput="edit.items[${i}].sets=Math.max(1,parseInt(this.value)||1)"><span class="mut">Powt.</span><input class="num" value="${esc(it.reps)}" oninput="edit.items[${i}].reps=this.value"></div></div>`;});
 h+=`<button class="sec full" onclick="openPicker(id=>{edit.items.push({ex:id,sets:3,reps:'10'});render()})">+ Dodaj ćwiczenie</button>
 <div class="row" style="margin-top:12px"><button class="full" onclick="savePlan()">Zapisz trening</button></div>`;
 if(edit.id)h+=`<div style="margin-top:12px"><button class="bad full" onclick="ask('Usunąć ten trening? Historia zostanie.','Usuń',()=>{S.plans=S.plans.filter(p=>p.id!=='${edit.id}');save();view=null;render()})">Usuń trening</button></div>`;
 return h;
}
function mv(i,d){const j=i+d;if(j<0||j>=edit.items.length)return;const t=edit.items[i];edit.items[i]=edit.items[j];edit.items[j]=t;render()}
function savePlan(){
 if(!edit.name.trim()){toast('Wpisz nazwę treningu');return}
 if(!edit.items.length){toast('Dodaj przynajmniej jedno ćwiczenie');return}
 if(edit.id){const i=S.plans.findIndex(p=>p.id===edit.id);S.plans[i]=edit}else{edit.id=uid();S.plans.push(edit)}
 save();view=null;render();
}

/* --- Aktywny trening --- */
function lastFor(exId){
 for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].entries.find(x=>x.ex===exId);if(e&&e.sets.length)return e.sets}
 return null;
}
function startPlan(id){
 if(S.active){ask('Masz już trening w toku. Zacząć nowy i porzucić tamten?','Zacznij nowy',()=>{S.active=null;startPlan(id)});return}
 const p=id?S.plans.find(x=>x.id===id):null;
 S.active={name:p?p.name:'Trening',start:Date.now(),items:p?p.items.map(it=>mkItem(it.ex,it.sets,it.reps)):[]};
 save();view='active';render();
}
function mkItem(exId,n,reps){
 const last=lastFor(exId);const sets=[];
 for(let i=0;i<n;i++){const l=last?(last[i]||last[last.length-1]):null;sets.push({kg:l?String(l.kg):'',reps:l?String(l.reps):String(reps||''),done:false})}
 return {ex:exId,sets};
}
function vActive(){
 const A=S.active;
 let h=`<div class="row sp"><button class="sec sm" onclick="view=null;render()">← Wróć</button><button class="sm" onclick="finish()">Zakończ</button></div>
 <h1 style="margin-bottom:2px">${esc(A.name)}</h1><div class="mut" id="elapsed" style="margin-bottom:12px"></div>`;
 A.items.forEach((it,ii)=>{
  const ex=getEx(it.ex);if(!ex)return;const last=lastFor(it.ex);
  h+=`<div class="card"><div class="row" style="margin-bottom:8px"><div class="th" style="width:70px;height:46px;background:var(--acc2);border-radius:10px;overflow:hidden;flex:none" onclick="openDetail('${ex.id}')">${thumb(ex)}</div>
  <div style="flex:1;min-width:0" onclick="openDetail('${ex.id}')"><h3>${esc(ex.name)}</h3><div class="mut">${last?'Ostatnio: '+last.map(s=>s.kg+'×'+s.reps).join(', '):'Pierwszy raz 🎉'}</div></div>
  <button class="bad sm" onclick="rmItem(${ii})">✕</button></div>
  <div class="sethead"><span>Seria</span><span>kg</span><span>Powt.</span><span>✓</span></div>`;
  it.sets.forEach((s,si)=>{h+=`<div class="set ${s.done?'done':''}"><span class="n">${si+1}</span>
   <input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="S.active.items[${ii}].sets[${si}].kg=this.value;save()">
   <input inputmode="decimal" placeholder="powt." value="${esc(s.reps)}" oninput="S.active.items[${ii}].sets[${si}].reps=this.value;save()">
   <button class="chk" onclick="toggleSet(${ii},${si})">✓</button></div>`});
  h+=`<div class="row"><button class="sec sm" onclick="addSet(${ii})">+ seria</button>${it.sets.length>1?`<button class="sec sm" onclick="S.active.items[${ii}].sets.pop();save();render()">− seria</button>`:''}</div></div>`;
 });
 h+='<button class="sec full" onclick="openPicker(id=>{S.active.items.push(mkItem(id,3,\'10\'));save();render()})">+ Dodaj ćwiczenie</button>';
 return h;
}
function addSet(ii){const s=S.active.items[ii].sets;const l=s[s.length-1];s.push({kg:l?l.kg:'',reps:l?l.reps:'',done:false});save();render()}
function rmItem(ii){ask('Usunąć to ćwiczenie z treningu?','Usuń',()=>{S.active.items.splice(ii,1);save();render()})}
let restEnd=0;
function toggleSet(ii,si){
 const s=S.active.items[ii].sets[si];s.done=!s.done;save();
 if(s.done&&S.rest>0){restEnd=Date.now()+S.rest*1000}else if(!s.done){restEnd=0}
 render();
}
function finish(){
 const A=S.active;
 const entries=A.items.map(it=>({ex:it.ex,sets:it.sets.filter(s=>s.done).map(s=>({kg:num(s.kg),reps:num(s.reps)}))})).filter(e=>e.sets.length);
 if(!entries.length){ask('Nie zaznaczyłaś żadnej serii (✓). Zakończyć bez zapisywania?','Zakończ bez zapisu',()=>{S.active=null;restEnd=0;save();view=null;tab='home';render()});return}
 ask('Zakończyć i zapisać trening?','Zapisz',()=>{
  S.logs.push({id:uid(),date:A.start,end:Date.now(),name:A.name,entries});
  S.active=null;restEnd=0;save();view=null;tab='hist';render();toast('Trening zapisany ✅');
 });
}

/* --- Odpoczynek / zegar --- */
function renderRest(){
 const el=document.getElementById('rest');
 if(restEnd>Date.now()&&view==='active')el.innerHTML=`<div class="rest"><div><span>Odpoczynek</span><b id="rt"></b><button onclick="restEnd=0;renderRest()">Pomiń</button></div></div>`;
 else el.innerHTML='';
 tick();
}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
let beeped=true;
function tick(){
 const e=document.getElementById('elapsed');if(e&&S.active)e.textContent='Czas: '+fmt((Date.now()-S.active.start)/1000);
 const rt=document.getElementById('rt');
 if(rt){const left=(restEnd-Date.now())/1000;if(left<=0){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(x){}restEnd=0;document.getElementById('rest').innerHTML=''}else rt.textContent=fmt(left)}
}
setInterval(tick,500);

/* --- Biblioteka --- */
function listHTML(st,mode){
 const q=st.q.trim().toLowerCase();
 const l=allEx().filter(e=>(!st.g||e.group===st.g)&&(!q||e.name.toLowerCase().includes(q)));
 if(!l.length)return '<div class="mut" style="padding:10px">Nic nie znaleziono.</div>';
 return l.map(e=>`<div class="ex" onclick="${mode==='pick'?`pickEx('${e.id}')`:`openDetail('${e.id}')`}"><div class="th">${thumb(e)}</div><div class="tx"><h3>${esc(e.name)}</h3><div class="mut">${esc(e.group)}${e.eq?' · '+esc(e.eq):''}</div></div>${mode==='pick'?`<button class="sec sm" onclick="event.stopPropagation();openDetail('${e.id}')">i</button>`:''}</div>`).join('');
}
function chipsHTML(st,fn){return '<div class="chips"><button class="chip '+(!st.g?'on':'')+`" onclick="${fn}('')">Wszystkie</button>`+GROUPS.map(g=>`<button class="chip ${st.g===g?'on':''}" onclick="${fn}('${g}')">${g}</button>`).join('')+'</div>'}
function vLib(){
 return `<div class="row sp"><h1>Ćwiczenia</h1><button class="sm" onclick="openCustom()">+ Własne</button></div>
 <input placeholder="Szukaj ćwiczenia…" value="${esc(LIB.q)}" oninput="LIB.q=this.value;document.getElementById('ll').innerHTML=listHTML(LIB,'lib')">
 <div id="lc">${chipsHTML(LIB,'libG')}</div><div id="ll">${listHTML(LIB,'lib')}</div>`;
}
function libG(g){LIB.g=g;document.getElementById('lc').innerHTML=chipsHTML(LIB,'libG');document.getElementById('ll').innerHTML=listHTML(LIB,'lib')}

/* --- Modale --- */
function modal(html){document.getElementById('modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`}
function closeModal(){clearInterval(animT);animT=null;document.getElementById('modal').innerHTML=''}
function ask(text,okLabel,cb){window._cb=cb;modal(`<p style="font-size:17px">${esc(text)}</p><div class="row"><button class="sec" style="flex:1" onclick="closeModal()">Anuluj</button><button style="flex:1" onclick="closeModal();window._cb()">${esc(okLabel)}</button></div>`)}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1f1d2b;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:15px';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

function openPicker(cb){
 pickCb=cb;PK={q:'',g:''};
 modal(`<div class="row sp"><h2 style="margin:0">Wybierz ćwiczenie</h2><button class="sec sm" onclick="closeModal()">Zamknij</button></div>
 <input style="margin-top:10px" placeholder="Szukaj…" oninput="PK.q=this.value;document.getElementById('pl').innerHTML=listHTML(PK,'pick')">
 <div id="pc">${chipsHTML(PK,'pkG')}</div><div id="pl">${listHTML(PK,'pick')}</div>
 <button class="sec full" onclick="openCustom(true)">+ Dodaj własne ćwiczenie</button>`);
}
function pkG(g){PK.g=g;document.getElementById('pc').innerHTML=chipsHTML(PK,'pkG');document.getElementById('pl').innerHTML=listHTML(PK,'pick')}
function pickEx(id){const cb=pickCb;closeModal();if(cb)cb(id)}

function bestKg(id){let b=0;S.logs.forEach(l=>l.entries.forEach(e=>{if(e.ex===id)e.sets.forEach(s=>{if(s.kg>b)b=s.kg})}));return b}
function openDetail(id){
 const ex=getEx(id);if(!ex)return;const b=bestKg(id);
 const pic=ex.img?`<div class="big"><img src="${ex.img}" alt=""></div>`:!ex.a?'':`<div class="big" id="anim">${figSVG(ex,0)}</div><div class="row" style="margin-top:8px"><button class="sec sm" style="flex:1" onclick="animMode(0)">Start</button><button class="sec sm" style="flex:1" onclick="animMode('play')">▶ Animacja</button><button class="sec sm" style="flex:1" onclick="animMode(1)">Koniec</button></div>`;
 modal(`<div class="row sp"><h2 style="margin:0">${esc(ex.name)}</h2><button class="sec sm" onclick="closeModal()">Zamknij</button></div>
 <div class="mut" style="margin:4px 0 4px">${esc(ex.group)}${ex.eq?' · '+esc(ex.eq):''}${b?' · Twój rekord: '+b+' kg':''}</div>${ex.mus?`<div class="mut" style="margin-bottom:10px">Pracują: ${esc(ex.mus)} <span style="color:var(--hl,#ff7a59)">(zaznaczone na rysunku)</span></div>`:'<div style="height:6px"></div>'}${pic}
 <h2>Jak wykonać</h2><ol>${(ex.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
 ${ex.tips?`<div class="card" style="background:var(--acc2)"><b>Wskazówka:</b> ${esc(ex.tips)}</div>`:''}
 ${ex.custom?`<button class="bad full" onclick="delCustom('${ex.id}')">Usuń to ćwiczenie</button>`:''}`);
 if(!ex.img&&ex.a){window._ex=ex;animMode('play')}
}
let ph=0,mode='play';
function animMode(m){
 clearInterval(animT);animT=null;mode=m;const el=document.getElementById('anim');if(!el)return;
 if(m==='play'){ph=0;animT=setInterval(()=>{ph+=0.045;const t=(1-Math.cos(ph))/2;el.innerHTML=figSVG(window._ex,t)},40)}
 else el.innerHTML=figSVG(window._ex,m);
}
function delCustom(id){ask('Usunąć to ćwiczenie? (zniknie też z planów)','Usuń',()=>{S.custom=S.custom.filter(e=>e.id!==id);S.plans.forEach(p=>p.items=p.items.filter(i=>i.ex!==id));save();render()})}

/* --- Własne ćwiczenie --- */
let newImg=null,fromPicker=false;
function openCustom(fp){
 newImg=null;fromPicker=!!fp;
 modal(`<h2 style="margin-top:0">Własne ćwiczenie</h2>
 <label class="lbl">Nazwa</label><input id="cn" placeholder="np. Przysiad bułgarski">
 <label class="lbl">Partia mięśni</label><select id="cg">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select>
 <label class="lbl">Opis wykonania (każda linia = jeden krok)</label><textarea id="cs" rows="4"></textarea>
 <label class="lbl">Zdjęcie lub grafika (opcjonalnie)</label><input type="file" accept="image/*" onchange="readImg(this)"><div id="cp" style="margin-top:8px"></div>
 <div class="row" style="margin-top:14px"><button class="sec" style="flex:1" onclick="closeModal()">Anuluj</button><button style="flex:1" onclick="saveCustom()">Zapisz</button></div>`);
}
function readImg(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const m=520,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);newImg=c.toDataURL('image/jpeg',0.8);document.getElementById('cp').innerHTML=`<img src="${newImg}" style="max-width:100%;border-radius:10px">`};im.src=r.result};
 r.readAsDataURL(f);
}
function saveCustom(){
 const n=document.getElementById('cn').value.trim();if(!n){toast('Wpisz nazwę');return}
 const ex={id:'c'+uid(),name:n,group:document.getElementById('cg').value,eq:'',custom:true,steps:document.getElementById('cs').value.split('\n').map(x=>x.trim()).filter(Boolean),tips:'',img:newImg};
 S.custom.push(ex);save();
 if(fromPicker&&pickCb){const cb=pickCb;closeModal();cb(ex.id)}else{closeModal();render()}
}

/* --- Historia --- */
function vHist(){
 let h='<h1>Historia</h1>';
 if(!S.logs.length)return h+'<div class="card mut">Tu pojawią się zakończone treningi.</div>';
 const week=Date.now()-7*864e5;const cnt=S.logs.filter(l=>l.date>week).length;
 h+=`<div class="card"><b>${S.logs.length}</b> treningów łącznie · <b>${cnt}</b> w ostatnich 7 dniach</div>`;
 S.logs.slice().reverse().forEach(l=>{
  const vol=l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.kg*s.reps,0),0);
  const d=new Date(l.date).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
  h+=`<details class="card"><summary><div class="row sp"><div><h3>${esc(l.name)}</h3><div class="mut">${d} · ${l.end?Math.round((l.end-l.date)/60000)+' min · ':''}${Math.round(vol)} kg objętości</div></div><span class="mut">▾</span></div></summary>
  <div style="margin-top:10px">${l.entries.map(e=>`<div style="margin-bottom:8px"><b>${esc((getEx(e.ex)||{name:'(usunięte)'}).name)}</b><div class="mut">${e.sets.map(s=>s.kg+' kg × '+s.reps).join(' &nbsp;|&nbsp; ')}</div></div>`).join('')}
  <button class="bad sm" onclick="ask('Usunąć ten trening z historii?','Usuń',()=>{S.logs=S.logs.filter(x=>x.id!=='${l.id}');save();render()})">Usuń</button></div></details>`;
 });
 return h;
}

/* --- Ustawienia --- */
function vSet(){
 return `<h1>Ustawienia</h1>
 <div class="card"><h3>Przerwa między seriami</h3><select style="margin-top:8px" onchange="S.rest=parseInt(this.value);save()">${[0,45,60,90,120,180].map(v=>`<option value="${v}" ${S.rest===v?'selected':''}>${v?v+' s':'wyłączona'}</option>`).join('')}</select></div>
 <div class="card"><h3>Jak mieć apkę na ekranie telefonu</h3><p class="mut">iPhone (Safari): przycisk Udostępnij → „Dodaj do ekranu początkowego”.<br>Android (Chrome): menu ⋮ → „Dodaj do ekranu głównego” / „Zainstaluj aplikację”.</p></div>
 <div class="card"><h3>Kopia zapasowa</h3><p class="mut">Dane są zapisane w tej przeglądarce na tym telefonie. Skopiuj kod poniżej i schowaj go (np. w notatkach), żeby nie stracić historii przy zmianie telefonu lub wyczyszczeniu przeglądarki.</p>
 <textarea id="bk" rows="3" readonly>${esc(JSON.stringify({plans:S.plans,logs:S.logs,custom:S.custom,rest:S.rest}))}</textarea>
 <div class="row" style="margin-top:8px"><button class="sec" onclick="copyBk()">Kopiuj kod</button></div>
 <label class="lbl">Przywróć z kopii (wklej kod)</label><textarea id="rs" rows="3"></textarea>
 <div class="row" style="margin-top:8px"><button class="sec" onclick="restoreBk()">Przywróć</button></div></div>
 <div class="card"><button class="bad full" onclick="ask('Na pewno usunąć WSZYSTKIE dane (plany, historię, własne ćwiczenia)?','Usuń wszystko',()=>{S={plans:[],logs:[],custom:[],active:null,rest:90};save();render()})">Usuń wszystkie dane</button></div>`;
}
function copyBk(){const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Skopiowano'),()=>toast('Zaznaczone – skopiuj ręcznie'))}catch(e){toast('Zaznaczone – skopiuj ręcznie')}}
function restoreBk(){
 try{const d=JSON.parse(document.getElementById('rs').value);if(!d||!Array.isArray(d.logs)||!Array.isArray(d.plans))throw 0;
  ask('Zastąpić obecne dane danymi z kopii?','Przywróć',()=>{S=Object.assign({plans:[],logs:[],custom:[],active:null,rest:90},d);save();render();toast('Przywrócono')})}
 catch(e){toast('Nieprawidłowy kod kopii')}
}
/* ===== Offline (service worker) i podpowiedź instalacji ===== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

render();
</script>
</body>
</html>
