<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#1f1d2b;--mut:#6b6880;--acc:#6c5ce7;--acc2:#efecff;--ok:#1fa971;--bad:#d64545;--line:#e6e3f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:520px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:6px 0 14px}h2{font-size:18px;margin:18px 0 8px}h3{margin:0;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(40,30,90,.08)}
.mut{color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:var(--acc2);color:var(--acc)}button.bad{background:#fdeaea;color:var(--bad)}button.sm{padding:7px 11px;font-size:14px}
button.full{width:100%}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
input,select,textarea{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:21px}.nav button.on{color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.chip{flex:none;background:#fff;color:var(--mut);border:1.5px solid var(--line);padding:6px 12px;border-radius:99px;font-size:14px;font-weight:500}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ex{display:flex;gap:10px;align-items:center;padding:8px;margin-bottom:8px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(40,30,90,.08)}
.ex .th{width:84px;height:56px;flex:none;background:var(--acc2);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ex .th img{width:100%;height:100%;object-fit:cover}.ex .tx{flex:1;min-width:0}

.ov{position:fixed;inset:0;background:rgba(20,15,50,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
ol{padding-left:20px;margin:8px 0}ol li{margin-bottom:6px}
.sethead,.set{display:grid;grid-template-columns:34px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:6px}

.rest{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:15;padding:0 14px}
.rest div{max-width:492px;width:100%;background:#1f1d2b;color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.rest b{font-size:22px}.rest button{background:#3b3857;padding:7px 12px}

details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}

<body>
<div id="app"></div>
<div id="rest"></div>
<div class="nav"><div id="nav"></div></div>
<div id="modal"></div>
<script>
/* ===== Ćwiczenia: model szkieletu (kinematyka) + biblioteka =====
   Rysunki są nasze (generowane kodem), opisy napisane po polsku od zera.
   Model: proporcje segmentów wg standardowych tabel antropometrycznych (Drillis i Contini / Winter),
   stopy i dłonie przypięte do podłoża i sprzętu (odwrotna kinematyka), tor sztangi liczony, a nie rysowany ręcznie. */
const GROUPS=['Nogi','Pośladki','Plecy','Klatka','Barki','Biceps','Triceps','Brzuch'];
const C={body:'#4b4676',far:'#aaa5d0',hl:'#ff7a59',skin:'#f2c7a5',metal:'#a3a8bd',plate:'#2f2c4a',pad:'#d8d3f2',frame:'#b9bdd2',floor:'#d6d2ec',cable:'#8a8ca3',guide:'#8f86e0'};
/* długości segmentów (px), wzrost figury ok. 122 px: udo .245H, podudzie .246H, tułów (biodro–bark) .288H, ramię .186H, przedramię z dłonią .25H */
const LT=30,LS=30,LK=35,LU=23,LF=22,LN=14;
const FLOOR=144,AYY=139;
const WD={torso:17,thigh:12,shin:9,uarm:8,farm:7};
const r1=x=>Math.round(x*10)/10;
const rad=d=>d*Math.PI/180;
const dUp=d=>[Math.sin(rad(d)),-Math.cos(rad(d))];   // kąt od pionu w górę, + do przodu (w prawo)
const dDn=d=>[Math.sin(rad(d)),Math.cos(rad(d))];    // kąt od pionu w dół, + do przodu
const vadd=(p,q)=>[p[0]+q[0],p[1]+q[1]],vmul=(p,k)=>[p[0]*k,p[1]*k];
const ln=(p,q,w,c)=>`<line x1="${r1(p[0])}" y1="${r1(p[1])}" x2="${r1(q[0])}" y2="${r1(q[1])}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const ci=(p,r,c)=>`<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r}" fill="${c}"/>`;
const padR=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${C.pad}"/>`;
const fr=(x1,y1,x2,y2,w)=>ln([x1,y1],[x2,y2],w||5,C.frame);
const plate=(p,r)=>ci(p,r,C.plate)+ci(p,r*0.36,C.metal);
const lerp=(a,b,t)=>a+(b-a)*t;
const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];

/* dwuczłonowa odwrotna kinematyka: P=początek, T=cel, side=po której stronie promienia wygina się staw */
function two(P,T,L1,L2,side){
 const dx=T[0]-P[0],dy=T[1]-P[1],d=Math.hypot(dx,dy)||1e-6;
 const mx=L1+L2-0.05,mn=Math.abs(L1-L2)+0.05,dd=Math.min(mx,Math.max(mn,d));
 const ux=dx/d,uy=dy/d,a=(L1*L1-L2*L2+dd*dd)/(2*dd),h=Math.sqrt(Math.max(0,L1*L1-a*a));
 return {J:[P[0]+ux*a+side*(-uy)*h,P[1]+uy*a+side*ux*h],E:[P[0]+ux*dd,P[1]+uy*dd]};
}
/* normalizacja pozy: sh/hs/hh -> biodro i cel dłoni w układzie bezwzględnym */
function norm(p){
 if(p.tr===undefined)return {...p};
 const q={...p},D=dUp(q.tr);
 if(q.sh){q.hip=[q.sh[0]-D[0]*LK,q.sh[1]-D[1]*LK];delete q.sh}
 const S=[q.hip[0]+D[0]*LK,q.hip[1]+D[1]*LK];
 if(q.hs){q.h=[S[0]+q.hs[0],S[1]+q.hs[1]];delete q.hs}
 if(q.hh){q.h=[q.hip[0]+q.hh[0],q.hip[1]+q.hh[1]];delete q.hh}
 return q;
}
function lerpPose(A,B,u){
 const o={};
 for(const k in A){const a=A[k],b=B[k]===undefined?a:B[k];
  if(Array.isArray(a))o[k]=a.map((x,i)=>lerp(x,b[i],u));
  else if(typeof a==='number')o[k]=lerp(a,b,u);else o[k]=a;}
 return o;
}
function poseAt(ex,u){
 if(ex.m){return u<0.5?lerpPose(ex.a,ex.m,u*2):lerpPose(ex.m,ex.b,(u-0.5)*2)}
 return lerpPose(ex.a,ex.b,u);
}
/* rozwiązanie szkieletu dla pozy */
function solve(ex,P){
 const j={},D=dUp(P.tr),ls=ex.ls||[-1,-1],as=ex.as||1;
 j.hip=P.hip;j.S=vadd(P.hip,vmul(D,LK));
 j.H=vadd(j.S,vmul(dUp(P.tr*(ex.neck!==undefined?ex.neck:0.6)),LN));
 // nogi
 if(P.lg){j.K=vadd(P.hip,vmul(dDn(P.lg[0]),LT));j.A=vadd(j.K,vmul(dDn(P.lg[1]),LS));j.K2=vadd(j.K,[-3,-1]);j.A2=vadd(j.A,[-3,-1])}
 else{const r=two(P.hip,P.ank,LT,LS,ls[0]);j.K=r.J;j.A=P.ank;
  if(P.ank2){const r2=two(P.hip,P.ank2,LT,LS,ls[1]);j.K2=r2.J;j.A2=P.ank2}
  else{j.K2=vadd(j.K,[-4,-1]);j.A2=vadd(j.A,[-4,-1])}}
 // sprzęt na plecach / biodrach
 const back=[-Math.cos(rad(P.tr)),-Math.sin(rad(P.tr))];
 if(ex.att==='back')j.bar=vadd(vadd(j.S,vmul(back,6)),vmul(D,-2));
 else if(ex.att==='hip')j.bar=vadd(j.hip,[0,-7]);
 // ręce
 let T=null;
 if(P.hb&&j.bar)T=vadd(j.bar,P.hb);else if(P.h)T=P.h;else if(P.hd)T=vadd(j.H,P.hd);
 if(T){const r=two(j.S,T,LU,LF,as);j.E=r.J;j.W=r.E}
 else{j.E=vadd(j.S,vmul(dDn(P.ar[0]),LU));j.W=vadd(j.E,vmul(dDn(P.ar[1]),LF))}
 if(P.farh){const r=two(j.S,P.farh,LU,LF,as);j.E2=r.J;j.W2=r.E}else{j.E2=vadd(j.E,[-4,-1.5]);j.W2=vadd(j.W,[-4,-1.5])}
 j.toe=P.toe;j.toe2=P.toe2;
 if(!j.bar)j.bar=j.W;
 return j;
}
function footSeg(A,K,toe,face){
 if(toe)return [A,toe];
 if(A[1]>=136)return [[A[0]-2,A[1]+2.5],[A[0]+14,A[1]+3.5]];
 const sx=A[0]-K[0],sy=A[1]-K[1],L=Math.hypot(sx,sy)||1,s=[sx/L,sy/L];
 const p1=[-s[1],s[0]],p2=[s[1],-s[0]],p=p1[0]>p2[0]?p1:p2;
 return [A,[A[0]+p[0]*11,A[1]+p[1]*11]];
}
/* ---- rysowanie: widok z boku ---- */
function figSide(ex,u,gd){
 const P=poseAt(ex,u),j=solve(ex,P),hl=new Set(ex.hl||[]);const col=(k,d)=>hl.has(k)?C.hl:d;
 let s=`<svg viewBox="0 -12 240 172" class="fig" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="${FLOOR}" x2="232" y2="${FLOOR}" stroke="${C.floor}" stroke-width="3" stroke-linecap="round"/>${ex.deco||''}`;
 if(gd){
  if(ex.mf){const x=solve(ex,poseAt(ex,0)).bar[0];s+=`<line x1="${x}" y1="-8" x2="${x}" y2="${FLOOR}" stroke="${C.guide}" stroke-width="1.2" stroke-dasharray="3 4" opacity=".7"/>`}
  if(ex.draw||ex.cable){let pts='';for(let i=0;i<=24;i++){const q=solve(ex,poseAt(ex,i/24)).bar;pts+=r1(q[0])+','+r1(q[1])+' '}
   s+=`<polyline points="${pts}" fill="none" stroke="${C.guide}" stroke-width="1.4" stroke-dasharray="3 3" opacity=".75"/>`}
 }
 s+=ln(j.S,j.E2,WD.uarm-1,C.far)+ln(j.E2,j.W2,WD.farm-1,C.far);
 s+=ln(j.hip,j.K2,WD.thigh-1,C.far)+ln(j.K2,j.A2,WD.shin-1,C.far);
 const m=mid(j.S,j.hip);
 s+=ln(j.S,m,WD.torso,col('torsoU',C.body))+ln(m,j.hip,WD.torso,col('torsoL',C.body));
 s+=ln(j.hip,j.K,WD.thigh,col('thigh',C.body))+ln(j.K,j.A,WD.shin,col('shin',C.body));
 if(hl.has('glute'))s+=ci(j.hip,8,C.hl);
 s+=ln(j.S,j.E,WD.uarm,col('uarm',C.body))+ln(j.E,j.W,WD.farm,col('farm',C.body));
 if(hl.has('shoulder'))s+=ci(j.S,7.5,C.hl);
 s+=ln(j.S,j.H,5,C.skin)+ci(j.H,8.5,C.skin)+ci(j.W,4,C.skin);
 const f1=footSeg(j.A,j.K,j.toe),f2=footSeg(j.A2,j.K2,j.toe2);
 s+=ln(f2[0],f2[1],4,C.far)+ln(f1[0],f1[1],5,C.body);
 const pt=j.bar;
 if(ex.cable){const cp=ex.cableTo==='ank'?j.A:j.W;s+=ln(ex.cable,cp,1.6,C.cable)+ci(ex.cable,4.5,C.metal)+ci(cp,2.5,C.metal)}
 if(ex.plate){const dx=j.A[0]-j.K[0],dy=j.A[1]-j.K[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;
  s+=ln([j.A[0]+nx*16+dx/L*5,j.A[1]+ny*16+dy/L*5],[j.A[0]-nx*16+dx/L*5,j.A[1]-ny*16+dy/L*5],6,C.metal)}
 if(ex.draw==='bar')s+=ln([pt[0]-15,pt[1]],[pt[0]+15,pt[1]],2.5,C.metal)+plate(pt,12);
 else if(ex.draw==='db')s+=plate(pt,6.5);
 else if(ex.draw==='kb')s+=`<path d="M${r1(pt[0]-5)} ${r1(pt[1]-5)} q5 -9 10 0" fill="none" stroke="${C.plate}" stroke-width="3"/>`+ci([pt[0],pt[1]+1],7.5,C.plate);
 return s+'</svg>';
}
/* ---- widok z przodu (parametry: ab=odwiedzenie ramienia, el=zgięcie łokcia, sr=uniesienie barków, lk=odwiedzenie nóg, seat) ---- */
function figFront(ex,u,gd){
 const P=poseAt(ex,u),hl=new Set(ex.hl||[]);const col=(k,d)=>hl.has(k)?C.hl:d;
 const seat=!!P.seat,hy=seat?108:81,sy=46-(P.sr||0),sl=[104,sy+2],sr_=[136,sy+2];
 const dir=(a,sg)=>[sg*Math.sin(rad(a)),Math.cos(rad(a))];
 const arm=(sh,sg)=>{const e=vadd(sh,vmul(dir(P.ab,sg),LU));const w=vadd(e,vmul(dir(P.ab+4,sg),LF*Math.cos(rad(P.el||0))));return {e,w}};
 const aL=arm(sl,-1),aR=arm(sr_,1);
 const leg=sg=>{const hp=[120+sg*8,hy];let k,a;
  if(seat){k=[hp[0]+sg*Math.sin(rad(P.lk))*LT,hy-1];a=[k[0]+sg*Math.sin(rad(P.lk))*14,k[1]+LS]}
  else{k=vadd(hp,vmul([sg*Math.sin(rad(P.lk)),Math.cos(rad(P.lk))],LT));a=vadd(k,vmul([sg*Math.sin(rad(P.lk)),Math.cos(rad(P.lk))],LS))}
  return {hp,k,a}};
 const lL=leg(-1),lR=leg(1);
 let s=`<svg viewBox="0 -12 240 172" class="fig" xmlns="http://www.w3.org/2000/svg"><line x1="8" y1="${FLOOR}" x2="232" y2="${FLOOR}" stroke="${C.floor}" stroke-width="3" stroke-linecap="round"/>${ex.deco||''}`;
 for(const l of [lL,lR])s+=ln(l.hp,l.k,WD.thigh+1,col('thigh',C.body))+ln(l.k,l.a,WD.shin+1,C.body);
 s+=ln([120,sy+4],[120,hy-2],24,col('torsoU',C.body))+ln(lL.hp,lR.hp,16,C.body)+ln(sl,sr_,14,col('torsoU',C.body));
 for(const [a,sh] of [[aL,sl],[aR,sr_]])s+=ln(sh,a.e,WD.uarm+1,col('uarm',C.body))+ln(a.e,a.w,WD.farm+1,C.body);
 if(hl.has('shoulder'))s+=ci(sl,7.5,C.hl)+ci(sr_,7.5,C.hl);
 if(hl.has('trap'))s+=ln([108,sy-4],[132,sy-4],11,C.hl);
 s+=ln([120,sy],[120,sy-11],5,C.skin)+ci([120,sy-18],8.5,C.skin)+ci(aL.w,4,C.skin)+ci(aR.w,4,C.skin);
 if(!seat)s+=ln(lL.a,[lL.a[0]-9,lL.a[1]],5,C.body)+ln(lR.a,[lR.a[0]+9,lR.a[1]],5,C.body);
 else s+=ln(lL.a,[lL.a[0]-7,lL.a[1]],5,C.body)+ln(lR.a,[lR.a[0]+7,lR.a[1]],5,C.body);
 if(ex.draw==='db')s+=plate(aL.w,6.5)+plate(aR.w,6.5);
 return s+'</svg>';
}
const figSVG=(ex,u,gd)=>ex.view==='front'?figFront(ex,u,gd):figSide(ex,u,gd);

/* ===== Dekoracje (sprzęt) ===== */
const D={
 bench:padR(34,108,114,8)+fr(46,116,46,144)+fr(136,116,136,144),
 box:padR(24,106,52,38),
 pbar:fr(80,22,162,22,5)+fr(90,22,90,144,3)+fr(152,22,152,144,3),
 hbar:fr(86,-1,160,-1,5)+fr(92,-1,92,144,3)+fr(154,-1,154,144,3),
 smith:fr(94,-10,94,144,3)+fr(112,-10,112,144,3),
 incline:ln([73,86],[98,109],11,C.pad)+padR(94,112,42,7)+fr(114,119,114,144),
 sideBench:padR(158,108,56,8)+fr(168,116,168,144)+fr(204,116,204,144),
 prone:padR(30,108,160,8)+fr(44,116,44,144)+fr(176,116,176,144),
 seatBack:padR(80,44,10,64)+padR(84,108,44,8)+fr(106,116,106,144),
 legext:padR(60,46,10,64)+padR(66,108,50,8)+fr(91,116,91,144),
 chestM:padR(76,46,9,66)+padR(80,108,44,8)+fr(102,116,102,144),
 pulldown:padR(80,108,44,8)+fr(102,116,102,144)+padR(108,97,26,7),
 seatedRow:padR(68,108,46,8)+fr(92,116,92,144)+fr(152,98,152,144,5),
 legpress:ln([80,124],[48,101],10,C.pad)+fr(100,141,185,100,4)+padR(70,126,26,7),
 preacher:ln([83,78],[108,103],10,C.pad)+fr(108,103,108,144,4)+padR(70,108,40,8)+fr(90,116,90,144),
 abduct:padR(96,108,48,8)+fr(120,116,120,144)
};

/* ===== Szablony ruchów =====  a = poza A, b = poza B (m = poza pośrednia). Opis kluczy pozy:
   sh/hip = bark lub biodro, tr = pochylenie tułowia (st. od pionu, + do przodu), ank/ank2 = kostki (stopy przypięte),
   h = cel dłoni (IK), hb = dłoń względem sztangi, hd = dłoń względem głowy, ar = kąty ramienia (FK), lg = kąty nogi (FK),
   toe = czubek stopy, ecc = faza opuszczania ('AB' = A→B to opuszczanie, 'BA' = B→A). */
const T={};
const tp=(id,o)=>{o.a=norm(o.a);o.b=norm(o.b);if(o.m)o.m=norm(o.m);T[id]=o};
const K=[112,AYY];
tp('squat_back',{g:'Nogi',hl:['thigh','glute'],mus:'czworogłowe ud, pośladki, prostowniki grzbietu',att:'back',mf:true,ecc:'AB',
 a:{sh:[119,46],tr:0,ank:K,hb:[3,3]},b:{sh:[119,86],tr:40,ank:K,hb:[3,3]},
 steps:['Stań na szerokość bioder lub odrobinę szerzej, palce stóp lekko na zewnątrz. Sztanga leży na plecach, ciężar nad środkiem stopy.','Napnij brzuch, odepchnij biodra do tyłu i zacznij uginać kolana. Tułów pochyla się, ale plecy zostają proste.','Zejdź w dół, aż uda będą mniej więcej równolegle do podłogi. Sztanga cały czas jedzie nad środkiem stopy.','Wypchnij się całą stopą w górę do pozycji wyjściowej.'],

 let a=clone(t.a),b=clone(t.b),m=t.m?clone(t.m):null;
 if(o.backArms){for(const p of [a,b]){delete p.ar;p.hb=[3,3]}}

  deco:o.deco!==undefined?o.deco:t.deco,hl:o.hl||t.hl,mus:o.mus||t.mus,neck:t.neck,ls:t.ls,as:t.as,mf:t.mf,ecc:t.ecc,plate:t.plate,
  att:o.att||t.att,cable:o.cable||t.cable,cableTo:o.cableTo,
  draw:o.draw!==undefined?o.draw:t.draw,

const allEx=()=>BUILTIN.concat(S.custom);
const getEx=id=>allEx().find(e=>e.id===id);

/* --- Aktywny trening --- */
function lastFor(exId){
 for(let i=S.logs.length-1;i>=0;i--){const e=S.logs[i].entries.find(x=>x.ex===exId);if(e&&e.sets.length)return e.sets}
 return null;
}
function startPlan(id){
 if(S.active){ask('Masz już trening w toku. Zacząć nowy i porzucić tamten?','Zacznij nowy',()=>{S.active=null;startPlan(id)});return}
 const p=id?S.plans.find(x=>x.id===id):null;
 S.active={name:p?p.name:'Trening',start:Date.now(),items:p?p.items.map(it=>mkItem(it.ex,it.sets,it.reps)):[]};
 save();view='active';render();
}
function mkItem(exId,n,reps){
 const last=lastFor(exId);const sets=[];
 for(let i=0;i<n;i++){const l=last?(last[i]||last[last.length-1]):null;sets.push({kg:l?String(l.kg):'',reps:l?String(l.reps):String(reps||''),done:false})}
 return {ex:exId,sets};
}
function vActive(){
 const A=S.active;
 let h=`<div class="row sp"><button class="sec sm" onclick="view=null;render()">← Wróć</button><button class="sm" onclick="finish()">Zakończ</button></div>
 <h1 style="margin-bottom:2px">${esc(A.name)}</h1><div class="mut" id="elapsed" style="margin-bottom:12px"></div>`;
 A.items.forEach((it,ii)=>{
  const ex=getEx(it.ex);if(!ex)return;const last=lastFor(it.ex);
  h+=`<div class="card"><div class="row" style="margin-bottom:8px"><div class="th" style="width:70px;height:46px;background:var(--acc2);border-radius:10px;overflow:hidden;flex:none" onclick="openDetail('${ex.id}')">${thumb(ex)}</div>
  <div style="flex:1;min-width:0" onclick="openDetail('${ex.id}')"><h3>${esc(ex.name)}</h3><div class="mut">${last?'Ostatnio: '+last.map(s=>s.kg+'×'+s.reps).join(', '):'Pierwszy raz 🎉'}</div></div>
  <button class="bad sm" onclick="rmItem(${ii})">✕</button></div>
  <div class="sethead"><span>Seria</span><span>kg</span><span>Powt.</span><span>✓</span></div>`;
  it.sets.forEach((s,si)=>{h+=`<div class="set ${s.done?'done':''}"><span class="n">${si+1}</span>
   <input inputmode="decimal" placeholder="kg" value="${esc(s.kg)}" oninput="S.active.items[${ii}].sets[${si}].kg=this.value;save()">
   <input inputmode="decimal" placeholder="powt." value="${esc(s.reps)}" oninput="S.active.items[${ii}].sets[${si}].reps=this.value;save()">
   <button class="chk" onclick="toggleSet(${ii},${si})">✓</button></div>`});
  h+=`<div class="row"><button class="sec sm" onclick="addSet(${ii})">+ seria</button>${it.sets.length>1?`<button class="sec sm" onclick="S.active.items[${ii}].sets.pop();save();render()">− seria</button>`:''}</div></div>`;
 });
 h+='<button class="sec full" onclick="openPicker(id=>{S.active.items.push(mkItem(id,3,\'10\'));save();render()})">+ Dodaj ćwiczenie</button>';
 return h;
}
function addSet(ii){const s=S.active.items[ii].sets;const l=s[s.length-1];s.push({kg:l?l.kg:'',reps:l?l.reps:'',done:false});save();render()}
function rmItem(ii){ask('Usunąć to ćwiczenie z treningu?','Usuń',()=>{S.active.items.splice(ii,1);save();render()})}
let restEnd=0;
function toggleSet(ii,si){
 const s=S.active.items[ii].sets[si];s.done=!s.done;save();
 if(s.done&&S.rest>0){restEnd=Date.now()+S.rest*1000}else if(!s.done){restEnd=0}

}
function finish(){
 const A=S.active;

 if(!entries.length){ask('Nie zaznaczyłaś żadnej serii (✓). Zakończyć bez zapisywania?','Zakończ bez zapisu',()=>{S.active=null;restEnd=0;save();view=null;tab='home';render()});return}
 ask('Zakończyć i zapisać trening?','Zapisz',()=>{
  S.logs.push({id:uid(),date:A.start,end:Date.now(),name:A.name,entries});
  S.active=null;restEnd=0;save();view=null;tab='hist';render();toast('Trening zapisany ✅');
 });
}

let mode='play',guide=false,t0=0;
/* tempo: faza kontrolowana (opuszczanie) ok. 2,5 s, faza siłowa ok. 1,2 s, krótkie pauzy */
function cyc(ex,ms){
 const slow=2500,fast=1200,hB=400,hA=300,sym=1500;let s,f,uu;
 if(!ex.ecc){const T=2*sym+hB+hA,x=ms%T;if(x<sym)return[(1-Math.cos(Math.PI*x/sym))/2,'Ruch w jedną stronę'];if(x<sym+hB)return[1,'Utrzymaj'];if(x<2*sym+hB)return[1-(1-Math.cos(Math.PI*(x-sym-hB)/sym))/2,'Powrót'];return[0,'Utrzymaj']}
 const ab=ex.ecc==='AB';const d1=ab?slow:fast,d2=ab?fast:slow;
 const T=d1+hB+d2+hA,x=ms%T;
 if(x<d1){return[(1-Math.cos(Math.PI*x/d1))/2,ab?'Opuszczanie: powoli, ok. 2–3 s':'Unoszenie: dynamicznie, ok. 1 s']}
 if(x<d1+hB)return[1,ab?'Dół: krótka pauza':'Góra: krótka pauza'];
 if(x<d1+hB+d2){const y=(x-d1-hB)/d2;return[1-(1-Math.cos(Math.PI*y))/2,ab?'Podnoszenie: dynamicznie, ok. 1 s':'Opuszczanie: powoli, ok. 2–3 s']}
 return[0,ab?'Góra: krótka pauza':'Dół: krótka pauza'];
}
function animMode(m){
 clearInterval(animT);animT=null;mode=m;const el=document.getElementById('anim'),ph=document.getElementById('phase');if(!el)return;
 const ex=window._ex;
 if(m==='play'){t0=Date.now();animT=setInterval(()=>{const r=cyc(ex,Date.now()-t0);el.innerHTML=figSVG(ex,r[0],guide);if(ph)ph.textContent=r[1]},40)}
 else{el.innerHTML=figSVG(ex,m,guide);if(ph)ph.textContent=m===0?'Pozycja startowa':'Pozycja końcowa'}
}
function toggleGuide(){guide=!guide;const b=document.getElementById('gbtn');if(b)b.textContent=guide?'Ukryj linie pomocnicze':'Pokaż linie pomocnicze';if(mode!=='play')animMode(mode)}

let newImg=null,fromPicker=false;
function openCustom(fp){
 newImg=null;fromPicker=!!fp;

 <label class="lbl">Nazwa</label><input id="cn" placeholder="np. Przysiad bułgarski">

 <label class="lbl">Opis wykonania (każda linia = jeden krok)</label><textarea id="cs" rows="4"></textarea>
 <label class="lbl">Zdjęcie lub grafika (opcjonalnie)</label><input type="file" accept="image/*" onchange="readImg(this)"><div id="cp" style="margin-top:8px"></div>

function readImg(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const m=520,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);newImg=c.toDataURL('image/jpeg',0.8);document.getElementById('cp').innerHTML=`<img src="${newImg}" style="max-width:100%;border-radius:10px">`};im.src=r.result};
 r.readAsDataURL(f);
}
function saveCustom(){
 const n=document.getElementById('cn').value.trim();if(!n){toast('Wpisz nazwę');return}
 const ex={id:'c'+uid(),name:n,group:document.getElementById('cg').value,eq:'',custom:true,steps:document.getElementById('cs').value.split('\n').map(x=>x.trim()).filter(Boolean),tips:'',img:newImg};
 S.custom.push(ex);save();
 if(fromPicker&&pickCb){const cb=pickCb;closeModal();cb(ex.id)}else{closeModal();render()}
}

/* --- Historia --- */
function vHist(){
 let h='<h1>Historia</h1>';
 if(!S.logs.length)return h+'<div class="card mut">Tu pojawią się zakończone treningi.</div>';
 const week=Date.now()-7*864e5;const cnt=S.logs.filter(l=>l.date>week).length;
 h+=`<div class="card"><b>${S.logs.length}</b> treningów łącznie · <b>${cnt}</b> w ostatnich 7 dniach</div>`;
 S.logs.slice().reverse().forEach(l=>{
  const vol=l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.kg*s.reps,0),0);
  const d=new Date(l.date).toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
  h+=`<details class="card"><summary><div class="row sp"><div><h3>${esc(l.name)}</h3><div class="mut">${d} · ${l.end?Math.round((l.end-l.date)/60000)+' min · ':''}${Math.round(vol)} kg objętości</div></div><span class="mut">▾</span></div></summary>
  <div style="margin-top:10px">${l.entries.map(e=>`<div style="margin-bottom:8px"><b>${esc((getEx(e.ex)||{name:'(usunięte)'}).name)}</b><div class="mut">${e.sets.map(s=>s.kg+' kg × '+s.reps).join(' &nbsp;|&nbsp; ')}</div></div>`).join('')}
  <button class="bad sm" onclick="ask('Usunąć ten trening z historii?','Usuń',()=>{S.logs=S.logs.filter(x=>x.id!=='${l.id}');save();render()})">Usuń</button></div></details>`;
 });
 return h;
}

/* --- Ustawienia --- */
function vSet(){
 return `<h1>Ustawienia</h1>
 <div class="card"><h3>Przerwa między seriami</h3><select style="margin-top:8px" onchange="S.rest=parseInt(this.value);save()">${[0,45,60,90,120,180].map(v=>`<option value="${v}" ${S.rest===v?'selected':''}>${v?v+' s':'wyłączona'}</option>`).join('')}</select></div>
 <div class="card"><h3>Jak mieć apkę na ekranie telefonu</h3><p class="mut">iPhone (Safari): przycisk Udostępnij → „Dodaj do ekranu początkowego”.<br>Android (Chrome): menu ⋮ → „Dodaj do ekranu głównego” / „Zainstaluj aplikację”.</p></div>
 <div class="card"><h3>Kopia zapasowa</h3><p class="mut">Dane są zapisane w tej przeglądarce na tym telefonie. Skopiuj kod poniżej i schowaj go (np. w notatkach), żeby nie stracić historii przy zmianie telefonu lub wyczyszczeniu przeglądarki.</p>
 <textarea id="bk" rows="3" readonly>${esc(JSON.stringify({plans:S.plans,logs:S.logs,custom:S.custom,rest:S.rest}))}</textarea>
 <div class="row" style="margin-top:8px"><button class="sec" onclick="copyBk()">Kopiuj kod</button></div>
 <label class="lbl">Przywróć z kopii (wklej kod)</label><textarea id="rs" rows="3"></textarea>
 <div class="row" style="margin-top:8px"><button class="sec" onclick="restoreBk()">Przywróć</button></div></div>
 <div class="card"><button class="bad full" onclick="ask('Na pewno usunąć WSZYSTKIE dane (plany, historię, własne ćwiczenia)?','Usuń wszystko',()=>{S={plans:[],logs:[],custom:[],active:null,rest:90};save();render()})">Usuń wszystkie dane</button></div>`;
}
function copyBk(){const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Skopiowano'),()=>toast('Zaznaczone – skopiuj ręcznie'))}catch(e){toast('Zaznaczone – skopiuj ręcznie')}}
function restoreBk(){
 try{const d=JSON.parse(document.getElementById('rs').value);if(!d||!Array.isArray(d.logs)||!Array.isArray(d.plans))throw 0;
  ask('Zastąpić obecne dane danymi z kopii?','Przywróć',()=>{S=Object.assign({plans:[],logs:[],custom:[],active:null,rest:90},d);save();render();toast('Przywrócono')})}
 catch(e){toast('Nieprawidłowy kod kopii')}
}
/* ===== Offline (service worker) i podpowiedź instalacji ===== */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

render();
</script>
</body>
</html>
